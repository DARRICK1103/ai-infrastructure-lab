apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-api-gateway
  namespace: ai-infra
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-api-gateway
  template:
    metadata:
      labels:
        app: ai-api-gateway
    spec:
      containers:
        - name: gateway
          image: ai-api-gateway:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: INFERENCE_URL
              value: "http://mock-inference:8000"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
